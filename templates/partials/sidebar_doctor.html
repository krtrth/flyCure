<p class="portal-sidebar-kicker">Doctor desk</p>
<p class="portal-sidebar-name">{{ user.get_full_name|default:user.username }}</p>
<nav class="portal-nav">
  <a href="{% url 'care:doctor_dashboard' %}" class="{% if active == 'overview' %}is-active{% endif %}">Overview</a>
  <a href="{% url 'care:doctor_dashboard' %}#requests">Requests</a>
  <a href="{% url 'care:doctor_dashboard' %}#upcoming">Appointments</a>
  <a href="{% url 'care:doctor_dashboard' %}#patients">Patients</a>
  <a href="{% url 'care:doctor_dashboard' %}#slots">Availability</a>
  <a href="{% url 'care:doctor_slot_add' %}" class="{% if active == 'slot' %}is-active{% endif %}">Add a slot</a>
  <a href="{% url 'care:doctor_test_add' %}" class="{% if active == 'test' %}is-active{% endif %}">Suggest a test</a>
</nav>
<form method="post" action="{% url 'accounts:logout' %}" class="portal-logout">
  {% csrf_token %}
  <button type="submit">Log out</button>
</form>
